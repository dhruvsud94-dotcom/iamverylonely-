<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>.</title>
<style>
  :root{
    --bg:#050403;
    --red:#c81414;
    --red-dim:#5a0a0a;
    --red-bright:#ff2b2b;
    --flicker:#e8dede;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    width:100%;
    height:100%;
    background:var(--bg);
    overflow:hidden;
  }

  body{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* looping background gif */
  .bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0.5;
    filter:grayscale(0.2) contrast(1.1);
    pointer-events:none;
  }

  /* scanlines */
  .scanlines{
    position:fixed;
    inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0.35) 1px,
      rgba(0,0,0,0) 2px
    );
    pointer-events:none;
    z-index:5;
  }

  /* slow vertical roll bar, like bad tracking */
  .tracking{
    position:fixed;
    left:0;
    right:0;
    height:14%;
    background:linear-gradient(
      to bottom,
      rgba(200,20,20,0) 0%,
      rgba(200,20,20,0.05) 50%,
      rgba(200,20,20,0) 100%
    );
    animation:roll 11s linear infinite;
    pointer-events:none;
    z-index:4;
  }

  @keyframes roll{
    0%{ top:-14%; }
    100%{ top:100%; }
  }

  /* vignette */
  .vignette{
    position:fixed;
    inset:0;
    background:radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,0.75) 100%);
    pointer-events:none;
    z-index:6;
  }

  .stage{
    position:relative;
    z-index:2;
    text-align:center;
    padding:0 6vw;
  }

  h1{
    font-family:Arial, Helvetica, sans-serif;
    text-transform:lowercase;
    font-weight:400;
    font-size:clamp(2.2rem, 8vw, 6rem);
    letter-spacing:0.03em;
    color:var(--red);
    filter:blur(0.6px);
    text-shadow:
      0 0 14px rgba(200,20,20,0.55),
      0 0 2px rgba(255,60,60,0.5);
    position:relative;
    display:inline-block;
    animation:flicker 4.4s infinite;
  }

  /* rgb-split glitch layers */
  h1::before,
  h1::after{
    content:'i am very lonely';
    position:absolute;
    left:0; top:0;
    width:100%;
    filter:blur(0.6px);
  }

  h1::before{
    color:#3fd0e0;
    opacity:0.5;
    animation:glitch-cyan 6.2s infinite;
    mix-blend-mode:screen;
  }

  h1::after{
    color:#ff2b2b;
    opacity:0.55;
    animation:glitch-red 5.6s infinite;
    mix-blend-mode:screen;
  }

  @keyframes flicker{
    0%,100%{ opacity:1; }
    2%{ opacity:0.55; }
    4%{ opacity:0.95; }
    46%{ opacity:1; }
    47%{ opacity:0.35; }
    48%{ opacity:1; }
    70%{ opacity:1; }
    71%{ opacity:0.6; }
    72%{ opacity:1; }
  }

  @keyframes glitch-cyan{
    0%,89%,100%{ transform:translate(0,0); opacity:0; }
    90%{ transform:translate(-3px,0); opacity:0.5; }
    92%{ transform:translate(2px,-1px); opacity:0.4; }
    94%{ transform:translate(-1px,1px); opacity:0.5; }
    96%{ transform:translate(0,0); opacity:0; }
  }

  @keyframes glitch-red{
    0%,88%,100%{ transform:translate(0,0); opacity:0; }
    89%{ transform:translate(3px,0); opacity:0.55; }
    91%{ transform:translate(-2px,1px); opacity:0.4; }
    93%{ transform:translate(1px,-1px); opacity:0.5; }
    95%{ transform:translate(0,0); opacity:0; }
  }

  .cursor{
    display:inline-block;
    width:0.5em;
    background:var(--red);
    margin-left:0.15em;
    animation:blink 1.1s steps(1) infinite;
    filter:blur(0.5px);
  }

  @keyframes blink{
    0%,50%{ opacity:1; }
    51%,100%{ opacity:0; }
  }
</style>
</head>
<body>

  <img class="bg" src="spiral.gif" alt="">
  <div class="tracking"></div>
  <div class="scanlines"></div>

  <div class="stage">
    <h1>i am very lonely<span class="cursor">&nbsp;</span></h1>
  </div>

  <div class="vignette"></div>
</body>
</html>
